# =====================================================================
# Observability stack for the Monolithic microservices demo.
#
#   docker compose -f observability/compose.yml up -d
#
#   Prometheus   http://localhost:9090
#   Grafana      http://localhost:3000     (no login - anonymous admin)
#   Zipkin       http://localhost:9411
#
# The Spring services run on the HOST, not in Docker, so Prometheus reaches
# them through host.docker.internal (see prometheus.yml).
#
# Tags are :latest on purpose - this is a local demo stack. Pin exact versions
# before anything like this goes near a real environment.
# =====================================================================
name: quiz-observability

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: quiz-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h     # demo data, no need to keep more
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      # Needed on Linux; harmless on Docker Desktop, which provides it already.
      - "host.docker.internal:host-gateway"
    mem_limit: 512m

  grafana:
    image: grafana/grafana:latest
    container_name: quiz-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    environment:
      # No login form: one less thing to fumble while presenting.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light          # projects better than dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    mem_limit: 512m

  # The services already point at localhost:9411. Without this running, the logs
  # fill with "Dropped N spans due to ConnectException" during a demo.
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: quiz-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    mem_limit: 512m

volumes:
  promdata:
  grafanadata:
