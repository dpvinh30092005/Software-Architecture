<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="24" fill="#0f172a"/>

  <!-- Title -->
  <text x="480" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#f8fafc">Software Architecture</text>
  <text x="480" y="78" text-anchor="middle" font-size="15" fill="#94a3b8">the same quiz app, built twice. one of them is sweating.</text>

  <!-- ============ MONOLITH ============ -->
  <rect x="30" y="95" width="360" height="400" rx="20" fill="#1e293b" stroke="#334155"/>
  <text x="210" y="122" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" fill="#fb923c">MONOLITH</text>

  <!-- the big guy -->
  <rect x="70" y="135" width="200" height="210" rx="18" fill="#f97316"/>
  <!-- face: nervous -->
  <circle cx="140" cy="162" r="6" fill="#1e293b"/>
  <circle cx="200" cy="162" r="6" fill="#1e293b"/>
  <path d="M143 182 q9 -7 18 0 q9 7 18 0 q9 -7 18 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <path d="M242 146 q6 10 0 16 q-6 -6 0 -16 z" fill="#7dd3fc"/>
  <!-- layers -->
  <rect x="82" y="200" width="176" height="38" rx="8" fill="#ea580c"/>
  <text x="170" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#fff7ed">Controller</text>
  <rect x="82" y="244" width="176" height="38" rx="8" fill="#c2410c"/>
  <text x="170" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#fff7ed">Service</text>
  <rect x="82" y="288" width="176" height="38" rx="8" fill="#9a3412"/>
  <text x="170" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#fff7ed">DAO</text>

  <!-- single db -->
  <line x1="170" y1="345" x2="170" y2="378" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M115 390 v42 a55 12 0 0 0 110 0 v-42" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="170" cy="390" rx="55" ry="12" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="421" text-anchor="middle" font-size="13" fill="#e2e8f0">questiondb</text>

  <!-- speech bubble -->
  <rect x="284" y="146" width="96" height="50" rx="12" fill="#f8fafc"/>
  <path d="M285 164 L270 174 L285 180 z" fill="#f8fafc"/>
  <text x="332" y="166" text-anchor="middle" font-size="12" fill="#0f172a">i do</text>
  <text x="332" y="184" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">EVERYTHING</text>

  <text x="210" y="474" text-anchor="middle" font-size="13" fill="#94a3b8">1 app · 1 DB · deploy and pray</text>

  <!-- ============ SPLIT ARROW ============ -->
  <text x="435" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">break it up</text>
  <line x1="400" y1="290" x2="468" y2="290" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- ============ MICROSERVICES ============ -->
  <rect x="480" y="95" width="450" height="400" rx="20" fill="#1e293b" stroke="#334155"/>
  <text x="705" y="122" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" fill="#60a5fa">MICROSERVICES</text>

  <!-- gateway -->
  <rect x="605" y="134" width="200" height="42" rx="12" fill="#a855f7"/>
  <text x="705" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#faf5ff">api-gateway</text>
  <line x1="650" y1="176" x2="602" y2="211" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="176" x2="808" y2="211" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- question-service -->
  <rect x="500" y="215" width="180" height="72" rx="14" fill="#22c55e"/>
  <circle cx="576" cy="236" r="4.5" fill="#052e16"/>
  <circle cx="604" cy="236" r="4.5" fill="#052e16"/>
  <path d="M578 246 q12 10 24 0" fill="none" stroke="#052e16" stroke-width="2.5" stroke-linecap="round"/>
  <text x="590" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#052e16">question-service</text>

  <!-- quiz-service -->
  <rect x="730" y="215" width="180" height="72" rx="14" fill="#3b82f6"/>
  <circle cx="806" cy="236" r="4.5" fill="#0b1b3a"/>
  <circle cx="834" cy="236" r="4.5" fill="#0b1b3a"/>
  <path d="M808 246 q12 10 24 0" fill="none" stroke="#0b1b3a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="820" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#eff6ff">quiz-service</text>

  <!-- feign call -->
  <text x="705" y="243" text-anchor="middle" font-size="11" fill="#cbd5e1">Feign</text>
  <line x1="728" y1="254" x2="684" y2="254" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- own databases -->
  <line x1="590" y1="287" x2="590" y2="312" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M540 324 v36 a50 11 0 0 0 100 0 v-36" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="590" cy="324" rx="50" ry="11" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="590" y="352" text-anchor="middle" font-size="12" fill="#e2e8f0">questiondb</text>

  <line x1="820" y1="287" x2="820" y2="312" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M770 324 v36 a50 11 0 0 0 100 0 v-36" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="820" cy="324" rx="50" ry="11" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="820" y="352" text-anchor="middle" font-size="12" fill="#e2e8f0">quizdb</text>

  <!-- registry -->
  <rect x="640" y="398" width="130" height="46" rx="12" fill="#475569" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="705" y="418" text-anchor="middle" font-size="13" font-weight="600" fill="#f1f5f9">service-registry</text>
  <text x="705" y="435" text-anchor="middle" font-size="11" fill="#cbd5e1">(Eureka)</text>

  <text x="705" y="474" text-anchor="middle" font-size="13" fill="#94a3b8">n apps · n DBs · n times the YAML</text>
</svg>
